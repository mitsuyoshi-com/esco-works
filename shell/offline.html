<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ESCO Works</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; font: 15px/1.7 "Yu Gothic UI", "Meiryo", system-ui, sans-serif; background: #f4f6fb; color: #1d2433; }
  main { max-width: 420px; padding: 32px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { margin: 0 0 20px; color: #4a5468; }
  button { font: inherit; padding: 10px 28px; border: 0; border-radius: 8px; background: #2459e6; color: #fff; cursor: pointer; }
  button:hover { background: #1b47c0; }
  small { display: block; margin-top: 18px; color: #7a8497; }
</style>
</head>
<body>
<main>
  <h1>ESCO Works につながりません</h1>
  <p>インターネットにつながっているかご確認ください。<br>つながると、自動でもう一度開きます。</p>
  <button id="retry" type="button">もう一度ひらく</button>
  <small>それでも開けないときは、アップドラフトへご連絡ください。</small>
</main>
<script>
  var u = new URLSearchParams(location.search).get('u');
  document.getElementById('retry').addEventListener('click', function () { if (u) location.href = u; });
</script>
</body>
</html>
