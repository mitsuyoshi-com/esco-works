<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'"><meta name="theme-color" content="#097c66"><title>ESCO Works | 同期ワークスペース</title><link rel="stylesheet" href="workspace.css"></head><body>
<header><button id="menu" aria-label="プロジェクト一覧">☰</button><strong>ESCO Works</strong><span id="who">スマホ・PCで同じ続きを</span><button id="logout" hidden>ログアウト</button></header>
<div id="notice" role="status"></div>
<section id="login"><h1>どこからでも、仕事の続きを。</h1><p>会社から案内されたアカウントでログインしてください。</p><form id="loginForm"><label id="urlRow" hidden>同期サーバーURL<input id="url" type="url" placeholder="https://…/esco-works" autocomplete="url"></label><label id="nameRow" hidden>名前<input id="name" autocomplete="name"></label><label>メールアドレス<input id="email" type="email" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required minlength="12"></label><button class="primary">ログイン</button></form><p>初めての方・パスワードを忘れた方は管理者に確認してください。</p></section>
<div id="workspace" hidden><aside id="sidebar"><div class="actions"><button id="newProject">＋ プロジェクト</button><button id="newSession">＋ 会話</button><button id="business">私の業務を教える</button></div><label>表示<select id="filter"><option value="active">会話一覧</option><option value="archived">アーカイブ</option><option value="deleted">ゴミ箱</option></select></label><div id="tree"></div><hr><div id="businessStatus"></div><button id="retryBusiness">共有MDを再保存</button><button id="driveSetup" hidden>共有フォルダの接続</button><button id="inviteStaff" hidden>社員を招待</button><button id="qr" hidden>スマホで開くQR</button><button id="import" hidden>このPCの既存履歴を取り込む</button><small>業務入力は社内の共有フォルダへ保存されます。</small></aside>
<main><div class="session-head"><h2 id="title">会話を選択してください</h2><button id="manage" hidden>… 管理</button></div><div id="projectInfo"></div><div id="messages" aria-live="polite"></div><div id="taskState"></div><div id="asks"></div><form id="sendForm"><div class="route"><label>実行先<select id="route"><option value="cloud">クラウドで相談（PC不要）</option><option value="pc">PCで実行（停止中は待機）</option></select></label><label id="pcRow" hidden>実行するPC<select id="pc"></select></label><button type="button" id="bind" hidden>このPCの作業フォルダ</button></div><textarea id="input" rows="3" placeholder="仕事内容や依頼を入力してください"></textarea><div class="send-actions"><span id="draftState"></span><button type="button" id="cancelTask" hidden>処理を停止</button><button id="send" class="primary">送信</button></div></form></main></div>
<dialog id="edit"><form method="dialog"><h2 id="editTitle">管理</h2><div id="editBody"></div><div class="actions"><button value="cancel">閉じる</button><button id="editSave" type="button" class="primary">保存</button></div></form></dialog>
<script src="workspace.js"></script></body></html>
